type: vmcp
displayName: MyEmailManaged
description: Access Gmail and Outlook.
components:
- name: Gmail
  id: gmail
  mcpServerCatalogEntryKey: obot-gmail
  toolPrefix: gmail_
  toolOverrides:
    - name: list_emails
      enabled: true
    - name: read_email
      enabled: true
    - name: list_drafts
      enabled: true
    - name: list_labels
      enabled: true
- name: Outlook
  mcpServerCatalogEntryKey: obot-outlook
  toolPrefix: outlook_
profiles:
- name: test1
  subjects:
    - type: user
      id: 2
  vmcpPermissions:
    allowedComponents:
        gmail:
          allowedTools:
             - list_emails
             - read_email
