type: vmcp
displayName: RepoAccessInvalid
description: Access Gmail and Outlook.
components:
- name: Github
  mcpServerCatalogEntryKey: obot-github
  id: github
  configuration:
    - key: GITHUB_MCP_PATH
      policy: userAllowed
    - key: AUTHORIZATION
      policy: userAllowed
- name: Gitlab
  id: gitlab
  mcpServerCatalogEntryKey: obot-gitlab
  configuration:
    - key: GITLAB_PERSONAL_ACCESS_TOKEN
      policy: fixed
profiles:
- name: everyone
  subjects:
    - type: selector
      id: "*"
  vmcpPermissions:
    allowAllComponents: true
