type: vmcp
displayName: EmailExternalRepo
description: Access Gmail and Outlook.
components:
- name: Gmail
  mcpServerCatalogEntryKey: https://github.com/sangee2004/v2repo::obot-gmail
  toolPrefix: gmail_
- name: Outlook
  mcpServerCatalogEntryKey: obot-outlook
  toolPrefix: outlook_
profiles:
- name: everyone
  subjects:
    - type: selector
      id: "*"
  vmcpPermissions:
    allowAllComponents: true

